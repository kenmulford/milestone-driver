name: CI

# Run the repo's shell test suites on every PR into develop or main, so both
# the driver's own auto-merge gate and the develop->main release PR have a
# real check to wait on. Two jobs cover the cross-platform nonNegotiable: a
# bash leg and its PowerShell 7+ (pwsh) twin. Both run on ubuntu-latest, which
# ships bash, jq, pwsh, and python3 preinstalled (the render-daemon
# stub-backed cases boot a python3 HTTP server).
on:
  pull_request:
    branches: [main, develop]

jobs:
  shell-tests-bash:
    name: shell-tests (bash)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: extract-version (bash)
        run: bash tests/extract-version.test.sh
      - name: ci-preflight-steps (bash)
        run: bash tests/ci-preflight-steps.test.sh
      - name: parse-md-epic-order (bash)
        run: bash tests/parse-md-epic-order.test.sh
      - name: render-daemon (bash)
        run: bash tests/render-daemon.test.sh
      - name: check-size-budgets (bash)
        run: bash tests/check-size-budgets.test.sh
      - name: check-doc-toc (bash)
        run: bash tests/check-doc-toc.test.sh
      - name: check-skill-frontmatter (bash)
        run: bash tests/check-skill-frontmatter.test.sh
      - name: code-review-gate (bash)
        run: bash tests/code-review-gate.test.sh
      - name: build-file-index (bash)
        run: bash tests/build-file-index.test.sh
      - name: write-cost-record (bash)
        run: bash tests/write-cost-record.test.sh
      - name: resolve-citation (bash)
        run: bash tests/resolve-citation.test.sh
      - name: triage-cache (bash)
        run: bash tests/triage-cache.test.sh
      - name: check-citations (bash)
        run: bash tests/check-citations.test.sh
      - name: classify-delta (bash)
        run: bash tests/classify-delta.test.sh
      - name: read-doc-section (bash)
        run: bash tests/read-doc-section.test.sh
      # The two scripts/check-* steps that run against THIS repo's real tree.
      # Every other checker is exercised through fixture roots only, which
      # proves the script works without gating a citation — or a missing
      # contents block — the repo actually broke, and both are invisible to
      # every other check here.
      - name: citations resolve (bash)
        run: bash scripts/check-citations.sh .
      - name: doc TOCs present (bash)
        run: bash scripts/check-doc-toc.sh .

  shell-tests-pwsh:
    name: shell-tests (pwsh)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: extract-version (pwsh)
        run: pwsh tests/extract-version.test.ps1
      - name: ci-preflight-steps (pwsh)
        run: pwsh tests/ci-preflight-steps.test.ps1
      - name: parse-md-epic-order (pwsh)
        run: pwsh tests/parse-md-epic-order.test.ps1
      - name: render-daemon (pwsh)
        run: pwsh tests/render-daemon.test.ps1
      - name: check-size-budgets (pwsh)
        run: pwsh tests/check-size-budgets.test.ps1
      - name: check-doc-toc (pwsh)
        run: pwsh tests/check-doc-toc.test.ps1
      - name: check-skill-frontmatter (pwsh)
        run: pwsh tests/check-skill-frontmatter.test.ps1
      - name: code-review-gate (pwsh)
        run: pwsh tests/code-review-gate.test.ps1
      - name: build-file-index (pwsh)
        run: pwsh tests/build-file-index.test.ps1
      - name: write-cost-record (pwsh)
        run: pwsh tests/write-cost-record.test.ps1
      - name: resolve-citation (pwsh)
        run: pwsh tests/resolve-citation.test.ps1
      - name: triage-cache (pwsh)
        run: pwsh tests/triage-cache.test.ps1
      - name: check-citations (pwsh)
        run: pwsh tests/check-citations.test.ps1
      - name: classify-delta (pwsh)
        run: pwsh tests/classify-delta.test.ps1
      # Twins of the bash leg's real-tree steps. Both legs run them because a
      # <line> that differs between the twins is the worst answer a citation
      # checker can give, and only running both catches that.
      - name: citations resolve (pwsh)
        run: pwsh scripts/check-citations.ps1 .
      - name: doc TOCs present (pwsh)
        run: pwsh scripts/check-doc-toc.ps1 .

  hook-smoke-macos:
    name: hook smoke (macOS /bin/bash 3.2)
    # macOS runners still ship /bin/bash 3.2 (Apple never shipped bash 4+ over
    # GPLv3) — the two jobs above run bash on ubuntu-latest's modern bash, so
    # neither ever exercises the actual bash-3.2 execution venue every hook
    # ships for. This job is that venue: it runs all six hooks directly (not
    # through the tests/*.test.sh golden-matrix runners) under /bin/bash with
    # representative stdin fixtures, so a `${var,,}`-class construct that
    # crashes 3.2 — a hook that crashes is a hook that silently ALLOWS — is
    # caught here, permanently, on every PR (issue #289 decision).
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: force-subagent — allow path (docs/ is always exempt)
        run: |
          set +e
          out=$(printf '%s' '{"tool_input":{"file_path":"docs/smoke.md"}}' | /bin/bash hooks/force-subagent.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: no-bom — allow path (no BOM)
        run: |
          set +e
          out=$(printf '%s' '{"tool_name":"Write","tool_input":{"content":"hello"}}' | /bin/bash hooks/no-bom.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: tests-green — allow path (no unitTestCmd configured in this repo)
        run: |
          set +e
          out=$(jq -n --arg cwd "$PWD" '{tool_input:{command:"git commit -m x"}, cwd:$cwd}' | /bin/bash hooks/tests-green.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: no-push — allow path (non-protected branch)
        run: |
          set +e
          out=$(jq -n --arg cwd "$PWD" '{tool_input:{command:"git push origin feature-x"}, cwd:$cwd}' | /bin/bash hooks/no-push.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: no-pr-to-protected — allow path (--base develop, not main)
        run: |
          set +e
          out=$(jq -n --arg cwd "$PWD" '{tool_input:{command:"gh pr create --base develop --title x"}, cwd:$cwd}' | /bin/bash hooks/no-pr-to-protected.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: code-review-gate — happy path (heading present)
        run: |
          set +e
          cmd='gh pr create --base develop --body "## Code Review

          LGTM"'
          out=$(jq -n --arg cmd "$cmd" --arg cwd "$PWD" '{tool_input:{command:$cmd}, cwd:$cwd}' | /bin/bash hooks/code-review-gate.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: code-review-gate — block path (heading missing)
        run: |
          set +e
          cmd='gh pr create --base develop --body "no heading here"'
          out=$(jq -n --arg cmd "$cmd" --arg cwd "$PWD" '{tool_input:{command:$cmd}, cwd:$cwd}' | /bin/bash hooks/code-review-gate.sh 2>&1); rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL rc=$rc (want 2) out=$out"; exit 1; }
      - name: code-review-gate — garbage stdin fails open
        run: |
          set +e
          out=$(printf 'not json at all {{{' | /bin/bash hooks/code-review-gate.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      # The golden-matrix runners, under the SAME 3.2 interpreter. The hook
      # smoke steps above cover hooks/ only; the runners themselves are shell
      # too, and a bash-4-only construct in one (a `local -n` nameref, say)
      # reports 0 passed here while shell-tests-bash stays green on
      # ubuntu-latest's bash 5 — issue #468. `bash` on this runner resolves to
      # 3.2 anyway; `/bin/bash` is explicit so the venue can never drift.
      - name: extract-version (/bin/bash 3.2)
        run: /bin/bash tests/extract-version.test.sh
      - name: ci-preflight-steps (/bin/bash 3.2)
        run: /bin/bash tests/ci-preflight-steps.test.sh
      - name: parse-md-epic-order (/bin/bash 3.2)
        run: /bin/bash tests/parse-md-epic-order.test.sh
      - name: render-daemon (/bin/bash 3.2)
        run: /bin/bash tests/render-daemon.test.sh
      - name: check-size-budgets (/bin/bash 3.2)
        run: /bin/bash tests/check-size-budgets.test.sh
      - name: check-doc-toc (/bin/bash 3.2)
        run: /bin/bash tests/check-doc-toc.test.sh
      - name: check-skill-frontmatter (/bin/bash 3.2)
        run: /bin/bash tests/check-skill-frontmatter.test.sh
      - name: code-review-gate (/bin/bash 3.2)
        run: /bin/bash tests/code-review-gate.test.sh
      - name: build-file-index (/bin/bash 3.2)
        run: /bin/bash tests/build-file-index.test.sh
      - name: write-cost-record (/bin/bash 3.2)
        run: /bin/bash tests/write-cost-record.test.sh
      - name: resolve-citation (/bin/bash 3.2)
        run: /bin/bash tests/resolve-citation.test.sh
      - name: triage-cache (/bin/bash 3.2)
        run: /bin/bash tests/triage-cache.test.sh
      - name: check-citations (/bin/bash 3.2)
        run: /bin/bash tests/check-citations.test.sh
      - name: classify-delta (/bin/bash 3.2)
        run: /bin/bash tests/classify-delta.test.sh
      - name: read-doc-section (/bin/bash 3.2)
        run: /bin/bash tests/read-doc-section.test.sh
