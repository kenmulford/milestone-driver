name: CI

# Every PR into develop or main runs each suite on both legs. One runner per
# suite (tests/<suite>.test.ps1 -Leg ps1|sh, helpers in tests/_lib.ps1): the
# ps1 leg runs in-process, the sh leg as a bash child. ubuntu-latest ships
# bash, jq, pwsh, and python3 (render-daemon's stub cases boot an HTTP server).
on:
  pull_request:
    branches: [main, develop]

jobs:
  shell-tests:
    # "shell-tests (bash)" and "shell-tests (pwsh)" are the required checks on
    # develop and main; renaming the job means editing branch protection too.
    name: shell-tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: bash, leg: sh }
          - { name: pwsh, leg: ps1 }
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: all suites, ${{ matrix.leg }} leg
        run: pwsh tests/run-all.ps1 -Leg ${{ matrix.leg }}
      # The two scripts/check-* steps that run against THIS repo's real tree,
      # on both legs, so a <line> that differs between twins is caught.
      - name: citations resolve
        run: bash scripts/check-citations.sh . && pwsh scripts/check-citations.ps1 .
      - name: doc TOCs present
        run: bash scripts/check-doc-toc.sh . && pwsh scripts/check-doc-toc.ps1 .

  hook-smoke-macos:
    name: hook smoke (macOS /bin/bash 3.2)
    # macOS still ships /bin/bash 3.2, the venue every hook ships for (a hook
    # that crashes is a hook that silently ALLOWS). The smoke steps run each
    # hook directly under it; the hook suites then run their sh leg with
    # /bin/bash as the child (MD_BASH_BIN), and the script suites with a modern
    # PATH bash, since scripts may need bash 4+ (mapfile).
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: force-subagent - allow path (docs/ is always exempt)
        run: |
          set +e
          out=$(printf '%s' '{"tool_input":{"file_path":"docs/smoke.md"}}' | /bin/bash hooks/force-subagent.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: no-bom - allow path (no BOM)
        run: |
          set +e
          out=$(printf '%s' '{"tool_name":"Write","tool_input":{"content":"hello"}}' | /bin/bash hooks/no-bom.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: tests-green - allow path (no unitTestCmd configured in this repo)
        run: |
          set +e
          out=$(jq -n --arg cwd "$PWD" '{tool_input:{command:"git commit -m x"}, cwd:$cwd}' | /bin/bash hooks/tests-green.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: no-push - allow path (non-protected branch)
        run: |
          set +e
          out=$(jq -n --arg cwd "$PWD" '{tool_input:{command:"git push origin feature-x"}, cwd:$cwd}' | /bin/bash hooks/no-push.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: no-pr-to-protected - allow path (--base develop, not main)
        run: |
          set +e
          out=$(jq -n --arg cwd "$PWD" '{tool_input:{command:"gh pr create --base develop --title x"}, cwd:$cwd}' | /bin/bash hooks/no-pr-to-protected.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: code-review-gate - happy path (heading present)
        run: |
          set +e
          cmd='gh pr create --base develop --body "## Code Review

          /code-review run: yes

          LGTM"'
          out=$(jq -n --arg cmd "$cmd" --arg cwd "$PWD" '{tool_input:{command:$cmd}, cwd:$cwd}' | /bin/bash hooks/code-review-gate.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: code-review-gate - block path (heading missing)
        run: |
          set +e
          cmd='gh pr create --base develop --body "no heading here"'
          out=$(jq -n --arg cmd "$cmd" --arg cwd "$PWD" '{tool_input:{command:$cmd}, cwd:$cwd}' | /bin/bash hooks/code-review-gate.sh 2>&1); rc=$?
          [ "$rc" -eq 2 ] || { echo "FAIL rc=$rc (want 2) out=$out"; exit 1; }
      - name: code-review-gate - garbage stdin fails open
        run: |
          set +e
          out=$(printf 'not json at all {{{' | /bin/bash hooks/code-review-gate.sh 2>&1); rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL rc=$rc out=$out"; exit 1; }
      - name: Put a modern bash on PATH for script children
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: hook suites, sh leg, children on /bin/bash 3.2
        run: pwsh tests/run-all.ps1 -Leg sh -Only force-subagent,tests-green,dispatch-cap,code-review-gate
        env:
          MD_BASH_BIN: /bin/bash
      - name: script suites, sh leg
        run: pwsh tests/run-all.ps1 -Leg sh -Skip force-subagent,tests-green,dispatch-cap,code-review-gate
